<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Entre em contato com Heitor Inácio Ribeiro.">
  <title>Contato | Portfólio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Meu Portfólio</a>
    <nav class="main-nav" aria-label="Navegação principal">
      <a href="index.html">Início</a><a href="Conhecimento.html">Conhecimentos</a>
      <a href="Têndencias.html">Tendências</a><a href="Galeria.html">Galeria</a><a href="Contato.html" aria-current="page">Contato</a>
    </nav>
  </header>
  <main class="container narrow">
    <section class="page-heading">
      <p class="eyebrow">Vamos conversar</p>
      <h1>Entre em contato</h1>
      <p>Preencha os campos abaixo. Os dados serão armazenados somente neste navegador, usando o armazenamento local.</p>
    </section>

    <form id="contact-form" class="contact-form">
      <label for="nome">Nome</label>
      <input type="text" id="nome" name="nome" autocomplete="name" maxlength="100" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="150" required>

      <label for="telefone">Telefone (opcional)</label>
      <input type="tel" id="telefone" name="telefone" autocomplete="tel" maxlength="30">

      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="6" maxlength="2000" required></textarea>

      <button class="button" type="submit">Salvar mensagem neste dispositivo</button>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
    </form>
    <a class="back-link" href="index.html">← Voltar para a página inicial</a>
  </main>
  <footer class="site-footer"><p>© <span class="year"></span> Heitor Inácio Ribeiro</p></footer>
  <script src="Localstorage.js" defer></script>
</body>
</html>
